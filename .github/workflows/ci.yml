name: Build check

# Runs on every pull request and on pushes to main so a broken edit is caught
# before it reaches the live site.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Check pre-rendered pages
        run: |
          test "$(find dist -name index.html | wc -l)" -ge 70
          grep -q "<h1" dist/services/index.html
          grep -q 'rel="canonical" href="https://prolocksmith-tech.com/services/"' dist/services/index.html
          grep -q 'noindex' dist/lp/car-lockout/index.html
      - name: SEO checks (titles, descriptions, canonicals, headings, structured data)
        run: |
          node scripts/check-seo.mjs
          node scripts/check-discovery.mjs
          node scripts/check-editorial.mjs
          node scripts/check-local-content.mjs
      - name: Verify asset references and performance budgets
        run: node scripts/check-phase-i.mjs
      - name: Install browser for site checks
        run: |
          npx playwright install --with-deps chromium
      - name: Browser checks (phone, tablet, laptop)
        run: |
          node scripts/serve-dist.mjs &
          sleep 5
          node scripts/check-site.mjs
          node scripts/check-seo-browser.mjs
          node scripts/check-agent-journeys.mjs
          node scripts/check-tracking.mjs
          node scripts/check-phase-viii.mjs
