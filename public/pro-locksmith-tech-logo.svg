<svg viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pltGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBE58B" />
      <stop offset="35%" stop-color="#F3CD58" />
      <stop offset="70%" stop-color="#D4A32A" />
      <stop offset="100%" stop-color="#8C6212" />
    </linearGradient>
    <linearGradient id="pltNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123258" />
      <stop offset="50%" stop-color="#0A1E38" />
      <stop offset="100%" stop-color="#051323" />
    </linearGradient>
    <linearGradient id="pltTechGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="pltKeyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>
    <filter id="pltShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="60" cy="60" r="58" fill="url(#pltNavyGrad)" stroke="url(#pltGoldGrad)" stroke-width="3.5" />
  <circle cx="60" cy="60" r="53" fill="none" stroke="url(#pltGoldGrad)" stroke-width="1" stroke-dasharray="2 2" opacity="0.6" />

  <!-- Shield Core -->
  <path d="M60 16 L94 30 V64 C94 84 79 100 60 106 C41 100 26 84 26 64 V30 Z" fill="url(#pltNavyGrad)" stroke="url(#pltGoldGrad)" stroke-width="2.2" filter="url(#pltShadow)" />

  <!-- Tech Circuit Lines -->
  <path d="M38 52 H48 L54 58 V68" stroke="url(#pltTechGrad)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
  <circle cx="38" cy="52" r="2" fill="#38BDF8" />
  <path d="M82 52 H72 L66 58 V68" stroke="url(#pltTechGrad)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
  <circle cx="82" cy="52" r="2" fill="#38BDF8" />

  <!-- Central Padlock Shackle -->
  <path d="M48 46 C48 38 52 32 60 32 C68 32 72 38 72 46 V52 H48 Z" fill="none" stroke="url(#pltGoldGrad)" stroke-width="3.5" stroke-linecap="round" />

  <!-- Padlock Body -->
  <rect x="44" y="50" width="32" height="30" rx="5" fill="url(#pltGoldGrad)" stroke="#8C6212" stroke-width="1.5" filter="url(#pltShadow)" />

  <!-- Padlock Keyway -->
  <circle cx="60" cy="61" r="3.5" fill="#051323" />
  <path d="M58 62 L57 73 H63 L62 62 Z" fill="#051323" />

  <!-- Precision Key Silhouette -->
  <g transform="rotate(-30 60 62)">
    <circle cx="38" cy="62" r="8" fill="none" stroke="url(#pltKeyGrad)" stroke-width="2.5" />
    <circle cx="38" cy="62" r="3.5" fill="none" stroke="url(#pltKeyGrad)" stroke-width="1.5" />
    <path d="M46 60.5 H84 V63.5 H46 Z M72 63.5 V68 H76 V63.5 Z M78 63.5 V67 H82 V63.5 Z" fill="url(#pltKeyGrad)" />
  </g>

  <!-- Stars -->
  <g fill="url(#pltGoldGrad)">
    <polygon points="60,94 62,99 67,99 63,102 65,107 60,104 55,107 57,102 53,99 58,99" />
    <polygon points="50,92 51.5,95.5 55,95.5 52,98 53.5,101.5 50,99.5 46.5,101.5 48,98 45,95.5 48.5,95.5" transform="scale(0.8) translate(12, 10)" />
    <polygon points="70,92 71.5,95.5 75,95.5 72,98 73.5,101.5 70,99.5 66.5,101.5 68,98 65,95.5 68.5,95.5" transform="scale(0.8) translate(18, 10)" />
  </g>
</svg>
